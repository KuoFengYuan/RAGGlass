name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --target .tools uv==0.8.22
          UV_CACHE_DIR="$PWD/.cache/uv" .tools/bin/uv sync --frozen
          npm --prefix frontend ci
      - name: Validate contracts, build, and bilingual docs
        run: bash scripts/check.sh
      # Real model tests are local and explicit, not replaced by mock inference in CI.
